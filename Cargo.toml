[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mjcamm/daw"
publish = false

[workspace.dependencies]
daw-automation = { path = "crates/daw-automation" }
daw-dsp = { path = "crates/daw-dsp" }
daw-engine = { path = "crates/daw-engine" }
daw-host = { path = "crates/daw-host" }
daw-plugins = { path = "crates/daw-plugins" }
daw-protocol = { path = "crates/daw-protocol" }
daw-rt = { path = "crates/daw-rt" }
daw-stretch = { path = "crates/daw-stretch" }
daw-testkit = { path = "crates/daw-testkit" }

audio_thread_priority = { version = "0.35.1", default-features = false }
cpal = { version = "0.18.2", features = ["realtime"] }
dirs = "7.0.0"
hound = "3.5.1"
rtrb = "0.4.0"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
unicode-segmentation = "1.13.2"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# The stretcher's FFT loops are ~50x slower unoptimised, which makes debug
# tests (where the realtime guard runs) crawl. Optimise just those crates.
[profile.dev.package.daw-stretch]
opt-level = 3
# Every library (GPUI, its layout and text code, cpal, ...) optimized in
# debug builds: unoptimized, the UI ran at about 20 frames a second. Our own
# crates stay in debug, so the realtime guard and debug checks still run.
[profile.dev.package."*"]
opt-level = 3
