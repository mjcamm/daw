[package]
name = "daw-plugins"
description = "Plugins in their own processes: the shared-memory audio channel, the DAW side that runs host processes, and the host side."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
audio_thread_priority.workspace = true
daw-protocol.workspace = true
daw-rt.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[dev-dependencies]
daw-engine.workspace = true
daw-testkit.workspace = true

[lints]
workspace = true
