[package]
name = "daw-ui"
description = "The desktop app: GPUI front end hosting the engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "daw"
path = "src/main.rs"

[dependencies]
daw-automation.workspace = true
daw-engine.workspace = true
daw-host.workspace = true
daw-plugins.workspace = true
daw-rt.workspace = true
daw-widgets.workspace = true
gpui.workspace = true

[dev-dependencies]
# The export UI test reads its file back.
hound.workspace = true

[lints]
workspace = true

[features]
# The full UI test run: headless app tests that click and type
# (`scripts/full-test.sh`). Off for everyday checks.
ui-tests = ["gpui/test-support"]
