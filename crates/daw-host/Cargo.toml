[package]
name = "daw-host"
description = "Runs the engine on a real audio device; shared by the app and the player."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
daw-device.workspace = true
daw-dsp.workspace = true
daw-engine.workspace = true
daw-plugins.workspace = true
daw-rt.workspace = true
dirs.workspace = true
hound.workspace = true
# MP3 export. LAME and its Rust bindings are LGPL: see docs/design/export.md.
mp3lame-encoder = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[features]
default = ["mp3"]
mp3 = ["dep:mp3lame-encoder"]

[dev-dependencies]
daw-testkit.workspace = true

[lints]
workspace = true
